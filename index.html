<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Punggur Geo Data</title><link rel="stylesheet"

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f9;

header{

}

}

.container{

.controls{

}

.search-row{
    display:flex;

}

input,button,select{
    border:1px solid #d1d5db;
    border-radius:9px;

}

input{
    flex:1;

}

button{

    background:#0f766e;

    border:none;

}

button:hover{

}

button.secondary{

}

}

.status{
    margin-top:10px;
    font-size:13px;
    color:#4b5563;
}

.nearest-box{
    background:linear-gradient(135deg,#ecfdf5,#f0fdfa);
    border:1px solid #a7f3d0;
    border-radius:14px;

    margin-bottom:15px;

}

.nearest-box h2{
    margin:0 0 8px;

}

.nearest-name{

}

}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);

    margin-bottom:15px;
}

.stat{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.stat-title{
    color:#6b7280;
    font-size:12px;
}

.stat-value{
    font-size:22px;
    font-weight:bold;
    margin-top:5px;
    color:#0f766e;
}

.list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.card{
    background:white;
    border-radius:14px;
    padding:16px;
    box-shadow:0 3px 10px rgba(0,0,0,.06);
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.card h3{
    margin:0 0 8px;
    color:#0f766e;
}

.badge{
    display:inline-block;
    background:#ccfbf1;
    color:#115e59;
    padding:4px 8px;
    border-radius:20px;
    font-size:11px;
    margin-bottom:8px;
}

.info{
    font-size:13px;
    line-height:1.7;
}

.distance{
    display:inline-block;
    margin-top:8px;
    background:#eff6ff;
    color:#1d4ed8;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.detail{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-top:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    display:none;
}

.detail h2{
    margin-top:0;
    color:#0f766e;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.detail-item{
    background:#f9fafb;
    padding:10px;
    border-radius:8px;
}

.detail-label{
    font-size:11px;
    color:#6b7280;
}

.detail-value{
    font-weight:bold;
    margin-top:3px;
}

.weather{
    margin-top:15px;
    background:#eff6ff;
    border-radius:12px;
    padding:14px;
}

footer{
    text-align:center;
    padding:25px;
    color:#6b7280;
    font-size:12px;
}

@media(max-width:800px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .list{
        grid-template-columns:1fr;
    }

    .detail-grid{
        grid-template-columns:repeat(2,1fr);
    }

    #map{
        height:360px;
    }
}

@media(max-width:500px){
    header h1{
        font-size:22px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    button{
        width:100%;
    }

    .search-row{
        flex-direction:column;
    }

    input{
        width:100%;
    }
}
</style></head><body><header>
    <h1>🌍 Punggur Geo Data</h1>
    <p>Data Geospasial Desa Kecamatan Punggur, Lampung Tengah</p>
</header><div class="container"><div class="controls">

    <div class="search-row">

        <input
            type="text"
            id="search"
            placeholder="🔎 Cari nama desa..."
        >

        <button onclick="gunakanLokasi()" class="location">
            📍 Gunakan Lokasi Saya
        </button>

        <button onclick="urutkanTerdekat()">
            📏 Cari Terdekat
        </button>

        <button onclick="resetData()" class="secondary">
            🔄 Reset
        </button>

    </div>

    <div id="status" class="status">
        Memuat data desa...
    </div>

</div>

<div id="nearestBox" class="nearest-box">

    <h2>📍 Desa Terdekat dari Lokasi Anda</h2>

    <div id="nearestName" class="nearest-name">
        -
    </div>

    <div id="nearestDistance" class="nearest-distance">
        -
    </div>

</div>

<div class="stats">

    <div class="stat">
        <div class="stat-title">Jumlah Desa</div>
        <div class="stat-value" id="totalDesa">0</div>
    </div>

    <div class="stat">
        <div class="stat-title">Total Penduduk</div>
        <div class="stat-value" id="totalPenduduk">0</div>
    </div>

    <div class="stat">
        <div class="stat-title">Luas Wilayah</div>
        <div class="stat-value" id="totalLuas">0</div>
    </div>

    <div class="stat">
        <div class="stat-title">Lokasi GPS</div>
        <div class="stat-value" id="gpsStatus">-</div>
    </div>

</div>

<div id="map"></div>

<div id="detail" class="detail"></div>

<h2>📋 Daftar Desa</h2>

<div id="list" class="list"></div>

</div><footer>
    Punggur Geo Data • Data desa berdasarkan struktur locations.json
</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>

let locations = [];
let filteredLocations = [];
let userLocation = null;
let markers = [];
let userMarker = null;

const map = L.map('map').setView([-5.04,105.28],13);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:'© OpenStreetMap contributors'
    }
).addTo(map);


/* =========================
   FORMAT ANGKA
========================= */

function angka(value){

    if(value === null || value === undefined){
        return '-';
    }

    return Number(value).toLocaleString('id-ID');
}


/* =========================
   FORMAT JARAK
========================= */

function formatJarak(km){

    if(km < 1){
        return Math.round(km * 1000) + ' meter';
    }

    return km.toFixed(2) + ' km';
}


/* =========================
   HITUNG JARAK
   HAVERSINE
========================= */

function hitungJarak(lat1,lon1,lat2,lon2){

    const R = 6371;

    const dLat =
        (lat2-lat1) * Math.PI/180;

    const dLon =
        (lon2-lon1) * Math.PI/180;

    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2) +

        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);

    const c =
        2 * Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return R*c;
}


/* =========================
   LOAD JSON
========================= */

async function loadData(){

    try{

        const response =
            await fetch('locations.json');

        if(!response.ok){
            throw new Error('locations.json tidak ditemukan');
        }

        locations =
            await response.json();

        filteredLocations =
            [...locations];

        tampilkanData();

        document.getElementById('status').innerText =
            'Data berhasil dimuat. Silakan cari desa atau gunakan GPS.';

    }catch(error){

        document.getElementById('status').innerText =
            '❌ Gagal memuat locations.json';

        console.error(error);
    }
}


/* =========================
   STATISTIK
========================= */

function updateStats(){

    document.getElementById('totalDesa').innerText =
        locations.length;

    const totalPenduduk =
        locations.reduce(
            (sum,x)=>
                sum + (Number(x.jumlah_penduduk)||0),
            0
        );

    const totalLuas =
        locations.reduce(
            (sum,x)=>
                sum + (Number(x.luas_km2)||0),
            0
        );

    document.getElementById('totalPenduduk').innerText =
        angka(totalPenduduk);

    document.getElementById('totalLuas').innerText =
        totalLuas.toFixed(2)+' km²';
}


/* =========================
   MARKER PETA
========================= */

function tampilkanMarker(data){

    markers.forEach(marker =>
        map.removeLayer(marker)
    );

    markers = [];

    data.forEach(desa => {

        if(
            desa.latitude === null ||
            desa.longitude === null
        ) return;

        const marker =
            L.marker([
                desa.latitude,
                desa.longitude
            ]).addTo(map);

        marker.bindPopup(`
            <b>${desa.nama}</b><br>
            Penduduk: ${angka(desa.jumlah_penduduk)}<br>
            Luas: ${desa.luas_km2 ?? '-'} km²
        `);

        marker.on('click',()=>{
            tampilkanDetail(desa);
        });

        markers.push(marker);

    });
}


/* =========================
   TAMPILKAN DAFTAR
========================= */

function tampilkanData(){

    const list =
        document.getElementById('list');

    list.innerHTML='';

    filteredLocations.forEach(desa => {

        let jarakHTML='';

        if(userLocation){

            const jarak =
                hitungJarak(
                    userLocation.lat,
                    userLocation.lng,
                    desa.latitude,
                    desa.longitude
                );

            desa._jarak = jarak;

            jarakHTML =
                `<div class="distance">
                    📏 ${formatJarak(jarak)}
                </div>`;
        }

        const card =
            document.createElement('div');

        card.className='card';

        card.innerHTML=`

            <span class="badge">
                ${desa.tipe || 'desa'}
            </span>

            <h3>${desa.nama}</h3>

            <div class="info">

                📍 ${desa.kode_pos || '-'}<br>

                👥 Penduduk:
                <b>${angka(desa.jumlah_penduduk)}</b><br>

                🗺️ Luas:
                <b>${desa.luas_km2 ?? '-'} km²</b><br>

                ⛰️ Elevasi:
                <b>${desa.elevasi_m ?? '-'} m</b>

                ${jarakHTML}

            </div>
        `;

        card.onclick=()=>{
            tampilkanDetail(desa);

            map.setView(
                [desa.latitude,desa.longitude],
                15
            );
        };

        list.appendChild(card);

    });

    tampilkanMarker(filteredLocations);

    updateStats();
}


/* =========================
   DETAIL DESA
========================= */

function tampilkanDetail(desa){

    const detail =
        document.getElementById('detail');

    detail.style.display='block';

    detail.innerHTML=`

        <h2>📌 ${desa.nama}</h2>

        <div class="detail-grid">

            <div class="detail-item">
                <div class="detail-label">Kode Kemendagri</div>
                <div class="detail-value">
                    ${desa.kode_kemendagri || '-'}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Kode Pos</div>
                <div class="detail-value">
                    ${desa.kode_pos || '-'}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Penduduk</div>
                <div class="detail-value">
                    ${angka(desa.jumlah_penduduk)}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Laki-laki</div>
                <div class="detail-value">
                    ${angka(desa.laki_laki)}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Perempuan</div>
                <div class="detail-value">
                    ${angka(desa.perempuan)}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Luas</div>
                <div class="detail-value">
                    ${desa.luas_km2 ?? '-'} km²
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Elevasi</div>
                <div class="detail-value">
                    ${desa.elevasi_m ?? '-'} meter
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">RT</div>
                <div class="detail-value">
                    ${desa.jumlah_rt ?? '-'}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Tempat Ibadah</div>
                <div class="detail-value">
                    ${desa.tempat_ibadah ?? '-'}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Pasar</div>
                <div class="detail-value">
                    ${desa.pasar ?? '-'}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Mini Market</div>
                <div class="detail-value">
                    ${desa.mini_market ?? '-'}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Sinyal</div>
                <div class="detail-value">
                    ${desa.kekuatan_sinyal || '-'}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Internet</div>
                <div class="detail-value">
                    ${desa.jenis_sinyal_internet || '-'}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Jalan</div>
                <div class="detail-value">
                    ${desa.jenis_jalan || '-'}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Angkutan Umum</div>
                <div class="detail-value">
                    ${desa.angkutan_umum || '-'}
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-label">Akses Sepanjang Tahun</div>
                <div class="detail-value">
                    ${desa.akses_jalan_sepanjang_tahun ? 'Ya' : 'Tidak'}
                </div>
            </div>

        </div>

        <div class="weather" id="weather">
            🌤️ Memuat informasi cuaca...
        </div>

    `;

    ambilCuaca(
        desa.latitude,
        desa.longitude,
        desa.nama
    );

    detail.scrollIntoView({
        behavior:'smooth'
    });
}


/* =========================
   CUACA OPEN-METEO
========================= */

async function ambilCuaca(lat,lon,nama){

    const weather =
        document.getElementById('weather');

    try{

        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=Asia%2FBangkok`;

        const response =
            await fetch(url);

        const data =
            await response.json();

        const current =
            data.current;

        const kode =
            current.weather_code;

        weather.innerHTML=`

            🌤️ <b>Cuaca ${nama}</b><br><br>

            🌡️ Suhu:
            <b>${current.temperature_2m}°C</b><br>

            🌡️ Terasa seperti:
            <b>${current.apparent_temperature}°C</b><br>

            💧 Kelembapan:
            <b>${current.relative_humidity_2m}%</b><br>

            💨 Kecepatan angin:
            <b>${current.wind_speed_10m} km/jam</b><br>

            ☁️ Kondisi:
            <b>${deskripsiCuaca(kode)}</b>

        `;

    }catch(error){

        weather.innerHTML =
            '⚠️ Informasi cuaca tidak tersedia saat ini.';

        console.error(error);
    }
}


/* =========================
   DESKRIPSI CUACA
========================= */

function deskripsiCuaca(code){

    if(code===0)
        return 'Cerah';

    if([1,2,3].includes(code))
        return 'Berawan';

    if([45,48].includes(code))
        return 'Berkabut';

    if([51,53,55,56,57].includes(code))
        return 'Gerimis';

    if([61,63,65,66,67].includes(code))
        return 'Hujan';

    if([71,73,75,77].includes(code))
        return 'Salju';

    if([80,81,82].includes(code))
        return 'Hujan deras';

    if([95,96,99].includes(code))
        return 'Badai petir';

    return 'Tidak diketahui';
}


/* =========================
   GPS
========================= */

function gunakanLokasi(){

    if(!navigator.geolocation){

        alert(
            'Browser Anda tidak mendukung GPS.'
        );

        return;
    }

    document.getElementById('status').innerText =
        '📍 Meminta izin lokasi...';

    navigator.geolocation.getCurrentPosition(

        position => {

            userLocation = {

                lat:
                    position.coords.latitude,

                lng:
                    position.coords.longitude

            };

            document.getElementById('gpsStatus')
                .innerText='Aktif';

            document.getElementById('status')
                .innerText =
                `📍 Lokasi ditemukan: ${userLocation.lat.toFixed(5)}, ${userLocation.lng.toFixed(5)}`;

            if(userMarker){
                map.removeLayer(userMarker);
            }

            userMarker =
                L.marker([
                    userLocation.lat,
                    userLocation.lng
                ])
                .addTo(map);

            userMarker.bindPopup(
                '<b>📍 Lokasi Anda</b>'
            ).openPopup();

            map.setView(
                [
                    userLocation.lat,
                    userLocation.lng
                ],
                13
            );

            urutkanTerdekat();

        },

        error => {

            document.getElementById('gpsStatus')
                .innerText='Gagal';

            document.getElementById('status')
                .innerText =
                '⚠️ Lokasi tidak dapat diakses. Pastikan izin lokasi diberikan.';

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );
}


/* =========================
   URUTKAN TERDEKAT
========================= */

function urutkanTerdekat(){

    if(!userLocation){

        alert(
            'Aktifkan lokasi Anda terlebih dahulu dengan tombol "Gunakan Lokasi Saya".'
        );

        return;
    }

    filteredLocations.forEach(desa => {

        desa._jarak =
            hitungJarak(
                userLocation.lat,
                userLocation.lng,
                desa.latitude,
                desa.longitude
            );

    });

    filteredLocations.sort(
        (a,b)=>
            a._jarak-b._jarak
    );

    const terdekat =
        filteredLocations[0];

    if(terdekat){

        document.getElementById('nearestBox')
            .style.display='block';

        document.getElementById('nearestName')
            .innerText =
            '📍 '+terdekat.nama;

        document.getElementById('nearestDistance')
            .innerText =
            'Jarak sekitar '+
            formatJarak(terdekat._jarak)+
            ' dari lokasi Anda.';

    }

    tampilkanData();

}


/* =========================
   PENCARIAN
========================= */

document
.getElementById('search')
.addEventListener(
    'input',
    function(){

        const keyword =
            this.value
                .toLowerCase()
                .trim();

        filteredLocations =
            locations.filter(desa =>
                desa.nama
                    .toLowerCase()
                    .includes(keyword)
            );

        if(userLocation){

            filteredLocations.forEach(desa => {

                desa._jarak =
                    hitungJarak(
                        userLocation.lat,
                        userLocation.lng,
                        desa.latitude,
                        desa.longitude
                    );

            });

            filteredLocations.sort(
                (a,b)=>
                    a._jarak-b._jarak
            );

        }

        tampilkanData();

    }
);


/* =========================
   RESET
========================= */

function resetData(){

    document.getElementById('search')
        .value='';

    filteredLocations =
        [...locations];

    document.getElementById('detail')
        .style.display='none';

    tampilkanData();

}


/* =========================
   START
========================= */

loadData();

</script></body>
  </html>
