<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#c95e1a">
<title>Punggur Geo Data V5</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--a:#c95e1a;--bg:#f3f1ec;--card:#fffdf8;--text:#282724;--muted:#77736b;--line:#dfdbd1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header,.wrap{max-width:1180px;margin:auto;padding-left:16px;padding-right:16px}header{padding-top:18px;padding-bottom:12px;display:flex;justify-content:space-between;align-items:start;gap:10px}
h1{margin:0;font-size:1.5rem}.sub{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.top{display:grid;grid-template-columns:1fr 150px auto auto;gap:8px;margin-bottom:10px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}button{cursor:pointer;font-weight:650}.primary{background:var(--a);color:#fff;border-color:var(--a)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px #0000000b}.stat{padding:11px}.stat b{display:block;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat span{color:var(--muted);font-size:.74rem}
.grid{display:grid;grid-template-columns:1fr 320px;gap:10px}.mapcard{overflow:hidden}.card{padding:13px}.mapcard{background:var(--card);border:1px solid var(--line);border-radius:14px}.maptools{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-top:1px solid var(--line)}.maptools button{font-size:.76rem;padding:8px}#map{height:min(62vh,620px);min-height:400px}
.side{display:grid;gap:10px}.near{display:flex;justify-content:space-between;padding:8px;border-radius:9px;background:#faf8f3;margin:6px 0;cursor:pointer}.muted{color:var(--muted);font-size:.8rem}
.panel{margin-top:10px}.head{display:flex;justify-content:space-between;align-items:center}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px;font-size:.82rem}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted)}tr:hover{background:#f7eee6}.badge{padding:3px 7px;border-radius:99px;background:#eeeae1;font-size:.7rem}
footer{text-align:center;color:#999;padding:15px;font-size:.75rem}a{color:var(--a)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.top{grid-template-columns:1fr 1fr}.top input{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.side{grid-template-columns:1fr}#map{min-height:380px}}
</style>
</head>
<body>
<header><div><h1>🗺️ Punggur Geo Data <small>V5</small></h1><p class="sub">Dashboard GIS Kecamatan Punggur, Kabupaten Lampung Tengah</p></div><a href="admin.html"><button>🔐 Admin</button></a></header>
<main class="wrap">
<section class="top"><input id="search" placeholder="🔍 Cari desa, kode, atau koordinat"><select id="filter"><option value="semua">Semua tipe</option><option value="desa">Desa</option><option value="kecamatan">Kecamatan</option></select><button class="primary" id="locate">📍 Saya</button><button id="share">🔗 Bagikan</button></section>
<section class="stats"><div class="stat"><b id="total">0</b><span>Total lokasi</span></div><div class="stat"><b id="desa">0</b><span>Desa</span></div><div class="stat"><b id="kec">0</b><span>Kecamatan</span></div><div class="stat"><b id="nearest">—</b><span>Terdekat</span></div><div class="stat"><b id="dist">—</b><span>Jarak</span></div></section>
<section class="grid"><div class="mapcard"><div id="map"></div><div class="maptools"><button id="fit">⛶ Semua</button><button id="street">🗺️ Street</button><button id="sat">🛰️ Satelit</button><button id="full">⛶ Fullscreen</button></div></div>
<aside class="side"><div class="card"><b>📍 Lokasi terdekat</b><div id="nearby" class="muted">Aktifkan lokasi.</div></div><div class="card"><b>☁️ Status data</b><p id="status" class="muted">Menghubungkan…</p></div></aside></section>
<section class="card panel"><div class="head"><h3>📍 Daftar Lokasi</h3><span id="count" class="muted">0</span></div><div class="table"><table><thead><tr><th>Nama</th><th>Tipe</th><th>Kode</th><th>Koordinat</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></section>
<footer>Punggur Geo Data V5 · <a href="admin.html">Dashboard Admin</a></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="supabase-config.js"></script>
<script>
const cfg=window.SUPABASE_CONFIG||{}, db=(cfg.url&&cfg.anonKey&&!cfg.url.includes("YOUR-PROJECT"))?supabase.createClient(cfg.url,cfg.anonKey):null;
const $=x=>document.getElementById(x), esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]||m));
let map=L.map("map").setView([-5.0383,105.2762],12), street=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map), sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"© Esri"}), data=[], markers=[], me=null;
function filtered(){let q=$("search").value.toLowerCase(),t=$("filter").value;return data.map((x,i)=>({x,i})).filter(o=>(!q||[o.x.nama,o.x.tipe,o.x.kode_pos,o.x.kode_kemendagri,o.x.latitude,o.x.longitude].join(" ").toLowerCase().includes(q))&&(t=="semua"||o.x.tipe==t))}
function render(){markers.forEach(m=>map.removeLayer(m));markers=[];let rows=filtered();rows.forEach(o=>{let x=o.x,m=L.circleMarker([x.latitude,x.longitude],{radius:x.tipe=="kecamatan"?10:8,fillColor:x.tipe=="kecamatan"?"#292824":"#c95e1a",color:"#fff",weight:2,fillOpacity:.92}).addTo(map).bindPopup("<b>"+esc(x.nama)+"</b><br>"+x.latitude.toFixed(5)+", "+x.longitude.toFixed(5)+"<br><button onclick='focusPoint("+o.i+")'>Detail</button>");m._id=x.id;markers.push(m)});
$("tbody").innerHTML=rows.map(o=>{let x=o.x;return "<tr onclick='focusPoint("+o.i+")'><td><b>"+esc(x.nama)+"</b></td><td><span class='badge'>"+esc(x.tipe)+"</span></td><td>"+esc(x.kode_pos||x.kode_kemendagri||"—")+"</td><td>"+x.latitude.toFixed(5)+", "+x.longitude.toFixed(5)+"</td><td>👁️</td></tr>"}).join("");
$("count").textContent=rows.length+" lokasi";$("total").textContent=data.length;$("desa").textContent=data.filter(x=>x.tipe=="desa").length;$("kec").textContent=data.filter(x=>x.tipe=="kecamatan").length;nearby()}
function focusPoint(i){let x=data[i];map.flyTo([x.latitude,x.longitude],15);let m=markers.find(m=>m._id==x.id);if(m)m.openPopup()}
function nearby(){if(!me){$("nearby").textContent="Aktifkan lokasi untuk menghitung jarak.";return}let d=data.map((x,i)=>({x,i,d:dist(me.lat,me.lng,x.latitude,x.longitude)})).sort((a,b)=>a.d-b.d).slice(0,5);$("nearby").innerHTML=d.map(o=>"<div class='near' onclick='focusPoint("+o.i+")'><span>📍 "+esc(o.x.nama)+"</span><b>"+o.d.toFixed(1)+" km</b></div>").join("");if(d[0]){$("nearest").textContent=d[0].x.nama;$("dist").textContent=d[0].d.toFixed(1)+" km"}}
function dist(a,b,c,d){let R=6371,A=(c-a)*Math.PI/180,B=(d-b)*Math.PI/180,x=Math.sin(A/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(B/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
async function load(){if(!db){$("status").textContent="Konfigurasi Supabase belum benar.";return}let r=await db.from("locations").select("id,nama,tipe,latitude,longitude,kode_kemendagri,kode_pos,sumber").order("nama");if(r.error){$("status").textContent="Gagal: "+r.error.message;return}data=r.data||[];$("status").textContent="✓ Online · "+data.length+" lokasi";render();if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.12));let s=new URLSearchParams(location.search).get("lokasi");if(s){let i=data.findIndex(x=>x.nama.toLowerCase()==decodeURIComponent(s).toLowerCase());if(i>=0)setTimeout(()=>focusPoint(i),500)}}
$("search").oninput=render;$("filter").onchange=render;$("fit").onclick=()=>markers.length&&map.fitBounds(L.featureGroup(markers).getBounds().pad(.12));$("street").onclick=()=>{map.removeLayer(sat);map.addLayer(street)};$("sat").onclick=()=>{map.removeLayer(street);map.addLayer(sat)};$("full").onclick=()=>document.querySelector(".mapcard").requestFullscreen?.();$("locate").onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{me={lat:p.coords.latitude,lng:p.coords.longitude};if(window.meMarker)map.removeLayer(window.meMarker);window.meMarker=L.circleMarker([me.lat,me.lng],{radius:9,fillColor:"#2f6fb0",color:"#fff",weight:2,fillOpacity:.95}).addTo(map).bindPopup("📍 Lokasi saya");map.flyTo([me.lat,me.lng],14);nearby()},()=>alert("Lokasi tidak tersedia"));$("share").onclick=()=>navigator.share?navigator.share({title:"Punggur Geo Data",url:location.href}):navigator.clipboard?.writeText(location.href);
load();
</script>
</body>
</html>
