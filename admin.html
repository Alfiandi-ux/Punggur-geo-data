<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Punggur Geo Data</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --danger:#dc2626;
  --success:#16a34a;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top right,#dbeafe,transparent 35%),
    var(--bg);
}

.login-card{
  width:100%;
  max-width:420px;
  background:white;
  border:1px solid var(--border);
  border-radius:22px;
  padding:32px;
  box-shadow:0 20px 60px rgba(15,23,42,.12);
}

.logo{
  width:58px;
  height:58px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--primary);
  color:white;
  font-size:27px;
  margin-bottom:20px;
}

.login-card h1{
  margin:0 0 8px;
}

.login-card p{
  color:var(--muted);
  margin-bottom:25px;
}

.form-group{
  margin-bottom:16px;
}

label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:11px;
  padding:11px 13px;
  outline:none;
  background:white;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.btn{
  border:0;
  border-radius:11px;
  padding:11px 16px;
  font-weight:600;
  transition:.2s;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-primary:hover{
  background:var(--primary-dark);
}

.btn-secondary{
  background:#e2e8f0;
  color:#334155;
}

.btn-danger{
  background:#fee2e2;
  color:var(--danger);
}

.btn-success{
  background:#dcfce7;
  color:#166534;
}

.btn-full{
  width:100%;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:11px;
  border-radius:10px;
  font-size:14px;
  margin-bottom:15px;
}

/* APP */

.app{
  min-height:100vh;
}

.topbar{
  background:white;
  border-bottom:1px solid var(--border);
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
}

.brand-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--primary);
  color:white;
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.user-email{
  font-size:13px;
  color:var(--muted);
}

.container{
  max-width:1300px;
  margin:auto;
  padding:25px;
}

.dashboard-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.dashboard-header h1{
  margin:0;
}

.dashboard-header p{
  margin:5px 0 0;
  color:var(--muted);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:22px;
}

.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:20px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.stat-value{
  font-size:28px;
  font-weight:800;
  margin-top:5px;
}

.toolbar{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:15px;
  display:flex;
  gap:12px;
  margin-bottom:15px;
}

.toolbar input{
  flex:1;
}

.table-card{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}

th,td{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:14px;
}

th{
  background:#f8fafc;
  color:#475569;
  font-size:12px;
  text-transform:uppercase;
}

.actions{
  display:flex;
  gap:7px;
}

.action-btn{
  border:0;
  border-radius:8px;
  padding:7px 10px;
  font-size:13px;
}

.edit{
  background:#dbeafe;
  color:#1d4ed8;
}

.delete{
  background:#fee2e2;
  color:#b91c1c;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal-card{
  background:white;
  width:100%;
  max-width:850px;
  max-height:90vh;
  overflow:auto;
  border-radius:20px;
  padding:25px;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modal-header h2{
  margin:0;
}

.close{
  border:0;
  background:#f1f5f9;
  border-radius:9px;
  width:36px;
  height:36px;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.form-grid .full{
  grid-column:1/-1;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

/* MOBILE */

@media(max-width:700px){

  .topbar{
    padding:0 15px;
  }

  .user-email{
    display:none;
  }

  .container{
    padding:15px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .dashboard-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .toolbar{
    flex-direction:column;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-grid .full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginPage" class="login-page">

  <div class="login-card">

    <div class="logo">📍</div>

    <h1>Admin Punggur Geo Data</h1>

    <p>Masuk untuk mengelola data desa Kecamatan Punggur.</p>

    <div id="loginError" class="error hidden"></div>

    <form id="loginForm">

      <div class="form-group">
        <label>Email</label>
        <input
          id="email"
          type="email"
          placeholder="admin@email.com"
          required
        >
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          id="password"
          type="password"
          placeholder="Password"
          required
        >
      </div>

      <button class="btn btn-primary btn-full" type="submit">
        🔐 Masuk
      </button>

    </form>

  </div>

</section>


<!-- ADMIN APP -->

<section id="app" class="app hidden">

  <header class="topbar">

    <div class="brand">

      <div class="brand-icon">📍</div>

      <div>
        Punggur Geo Data
        <div style="font-size:11px;color:#64748b">
          Admin Panel
        </div>
      </div>

    </div>

    <div class="user-area">

      <span id="userEmail" class="user-email"></span>

      <button
        id="logoutBtn"
        class="btn btn-secondary"
      >
        Keluar
      </button>

    </div>

  </header>


  <main class="container">

    <div class="dashboard-header">

      <div>
        <h1>Dashboard</h1>
        <p>Kelola data desa Punggur.</p>
      </div>

      <button
        id="addBtn"
        class="btn btn-primary"
      >
        + Tambah Desa
      </button>

    </div>


    <div class="stats">

      <div class="stat">
        <div class="stat-label">Jumlah Desa</div>
        <div id="totalDesa" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Total Penduduk</div>
        <div id="totalPenduduk" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Tahun Data</div>
        <div id="tahunData" class="stat-value">-</div>
      </div>

    </div>


    <div class="toolbar">

      <input
        id="search"
        type="search"
        placeholder="🔎 Cari nama desa..."
      >

      <button
        id="refreshBtn"
        class="btn btn-secondary"
      >
        ↻ Refresh
      </button>

    </div>


    <div class="table-card">

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>Desa</th>
              <th>Kode</th>
              <th>Penduduk</th>
              <th>Koordinat</th>
              <th>Tahun</th>
              <th>Aksi</th>
            </tr>

          </thead>

          <tbody id="tableBody">

          </tbody>

        </table>

      </div>

    </div>

  </main>

</section>


<!-- MODAL -->

<div id="modal" class="modal hidden">

  <div class="modal-card">

    <div class="modal-header">

      <h2 id="modalTitle">Tambah Desa</h2>

      <button id="closeModal" class="close">
        ×
      </button>

    </div>


    <form id="locationForm">

      <div class="form-grid">

        <div>
          <label>ID</label>
          <input id="f_id" required>
        </div>

        <div>
          <label>Nama Desa</label>
          <input id="f_nama" required>
        </div>

        <div>
          <label>Kode Kemendagri</label>
          <input id="f_kode_kemendagri">
        </div>

        <div>
          <label>Kode Pos</label>
          <input id="f_kode_pos">
        </div>

        <div>
          <label>Latitude</label>
          <input id="f_latitude" type="number" step="any">
        </div>

        <div>
          <label>Longitude</label>
          <input id="f_longitude" type="number" step="any">
        </div>

        <div>
          <label>Elevasi (meter)</label>
          <input id="f_elevasi_m" type="number" step="any">
        </div>

        <div>
          <label>Jumlah Penduduk</label>
          <input id="f_jumlah_penduduk" type="number">
        </div>

        <div>
          <label>Laki-laki</label>
          <input id="f_laki_laki" type="number">
        </div>

        <div>
          <label>Perempuan</label>
          <input id="f_perempuan" type="number">
        </div>

        <div>
          <label>Luas (km²)</label>
          <input id="f_luas_km2" type="number" step="any">
        </div>

        <div>
          <label>Luas (ha)</label>
          <input id="f_luas_ha" type="number" step="any">
        </div>

        <div>
          <label>Jumlah RT</label>
          <input id="f_jumlah_rt" type="number">
        </div>

        <div>
          <label>Tempat Ibadah</label>
          <input id="f_tempat_ibadah" type="number">
        </div>

        <div>
          <label>Operator Seluler</label>
          <input id="f_operator_seluler" type="number">
        </div>

        <div>
          <label>Kekuatan Sinyal</label>
          <input id="f_kekuatan_sinyal">
        </div>

        <div>
          <label>Internet</label>
          <input id="f_jenis_sinyal_internet">
        </div>

        <div>
          <label>Jenis Jalan</label>
          <input id="f_jenis_jalan">
        </div>

        <div>
          <label>Angkutan Umum</label>
          <input id="f_angkutan_umum">
        </div>

        <div>
          <label>Tahun Data</label>
          <input id="f_tahun_data" type="number">
        </div>

        <div class="full">
          <label>Sumber</label>
          <input id="f_sumber">
        </div>

        <div class="full">
          <label>Catatan</label>
          <textarea id="f_catatan_data"></textarea>
        </div>

      </div>


      <div class="modal-footer">

        <button
          type="button"
          id="cancelBtn"
          class="btn btn-secondary"
        >
          Batal
        </button>

        <button
          type="submit"
          class="btn btn-primary"
        >
          💾 Simpan
        </button>

      </div>

    </form>

  </div>

</div>


<script>

/* ============================================
   SUPABASE CONFIGURATION
   ============================================ */

const SUPABASE_URL = "inztdtmuxcajytktqsfx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-Xez7NgBI2l8BT_tvx9OdA_Qjz-z1mC";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* ============================================
   ELEMENTS
   ============================================ */

const loginPage =
  document.getElementById("loginPage");

const app =
  document.getElementById("app");

const loginForm =
  document.getElementById("loginForm");

const loginError =
  document.getElementById("loginError");

const tableBody =
  document.getElementById("tableBody");

const search =
  document.getElementById("search");

const modal =
  document.getElementById("modal");

const locationForm =
  document.getElementById("locationForm");

let locations = [];

let editMode = false;

let originalId = null;


/* ============================================
   LOGIN
   ============================================ */

loginForm.addEventListener("submit", async e => {

  e.preventDefault();

  loginError.classList.add("hidden");

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    loginError.textContent =
      "Login gagal: " + error.message;

    loginError.classList.remove("hidden");

    return;
  }

  await checkAdmin();

});


/* ============================================
   CHECK SESSION
   ============================================ */

async function checkSession(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient.auth.getSession();

  if(!session){

    showLogin();

    return;
  }

  await checkAdmin();

}


/* ============================================
   CHECK ADMIN
   ============================================ */

async function checkAdmin(){

  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();

  if(!user){

    showLogin();

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("admins")
      .select("id,email,role")
      .eq("id",user.id)
      .eq("role","admin")
      .maybeSingle();


  if(error || !data){

    await supabaseClient.auth.signOut();

    loginError.textContent =
      "Akun ini bukan admin.";

    loginError.classList.remove("hidden");

    showLogin();

    return;
  }


  document.getElementById("userEmail").textContent =
    user.email;

  showApp();

  loadLocations();

}


/* ============================================
   UI
   ============================================ */

function showLogin(){

  loginPage.classList.remove("hidden");

  app.classList.add("hidden");

}


function showApp(){

  loginPage.classList.add("hidden");

  app.classList.remove("hidden");

}


/* ============================================
   LOAD LOCATIONS
   ============================================ */

async function loadLocations(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("locations")
      .select("*")
      .order("nama");


  if(error){

    alert(
      "Gagal mengambil data: " +
      error.message
    );

    return;
  }


  locations = data || [];

  renderLocations();

  updateStats();

}


/* ============================================
   RENDER
   ============================================ */

function renderLocations(){

  const keyword =
    search.value.toLowerCase().trim();


  const filtered =
    locations.filter(item =>
      (item.nama || "")
        .toLowerCase()
        .includes(keyword)
    );


  tableBody.innerHTML = "";


  if(filtered.length === 0){

    tableBody.innerHTML = `
      <tr>
        <td colspan="6"
          style="text-align:center;padding:30px;color:#64748b">
          Data tidak ditemukan.
        </td>
      </tr>
    `;

    return;
  }


  filtered.forEach(item => {

    const tr =
      document.createElement("tr");


    tr.innerHTML = `

      <td>
        <strong>${escapeHtml(item.nama || "-")}</strong>
      </td>

      <td>
        ${escapeHtml(item.kode_kemendagri || "-")}
      </td>

      <td>
        ${(item.jumlah_penduduk || 0)
          .toLocaleString("id-ID")}
      </td>

      <td>
        ${item.latitude ?? "-"},
        ${item.longitude ?? "-"}
      </td>

      <td>
        ${item.tahun_data ?? "-"}
      </td>

      <td>

        <div class="actions">

          <button
            class="action-btn edit"
            onclick="editLocation('${item.id}')"
          >
            ✏️ Edit
          </button>

          <button
            class="action-btn delete"
            onclick="deleteLocation('${item.id}')"
          >
            🗑️ Hapus
          </button>

        </div>

      </td>

    `;


    tableBody.appendChild(tr);

  });

}


/* ============================================
   STATS
   ============================================ */

function updateStats(){

  document.getElementById("totalDesa")
    .textContent =
      locations.length.toLocaleString("id-ID");


  const total =
    locations.reduce(
      (sum,item) =>
        sum + Number(item.jumlah_penduduk || 0),
      0
    );


  document.getElementById("totalPenduduk")
    .textContent =
      total.toLocaleString("id-ID");


  const years =
    locations
      .map(x => x.tahun_data)
      .filter(Boolean);


  document.getElementById("tahunData")
    .textContent =
      years.length
        ? Math.max(...years)
        : "-";

}


/* ============================================
   OPEN ADD
   ============================================ */

document.getElementById("addBtn")
  .addEventListener("click", () => {

    editMode = false;

    originalId = null;

    locationForm.reset();

    document.getElementById("modalTitle")
      .textContent =
        "Tambah Desa";

    modal.classList.remove("hidden");

  });


/* ============================================
   EDIT
   ============================================ */

window.editLocation =
async function(id){

  const item =
    locations.find(x => x.id === id);

  if(!item) return;


  editMode = true;

  originalId = id;


  document.getElementById("modalTitle")
    .textContent =
      "Edit Desa";


  const fields = [
    "id",
    "nama",
    "kode_kemendagri",
    "kode_kode_pos",
    "latitude",
    "longitude",
    "elevasi_m",
    "jumlah_penduduk",
    "laki_laki",
    "perempuan",
    "luas_km2",
    "luas_ha",
    "jumlah_rt",
    "tempat_ibadah",
    "operator_seluler",
    "kekuatan_sinyal",
    "jenis_sinyal_internet",
    "jenis_jalan",
    "angkutan_umum",
    "tahun_data",
    "sumber",
    "catatan_data"
  ];


  const mapping = {

    id:"f_id",
    nama:"f_nama",
    kode_kemendagri:"f_kode_kemendagri",
    kode_pos:"f_kode_pos",
    latitude:"f_latitude",
    longitude:"f_longitude",
    elevasi_m:"f_elevasi_m",
    jumlah_penduduk:"f_jumlah_penduduk",
    laki_laki:"f_laki_laki",
    perempuan:"f_perempuan",
    luas_km2:"f_luas_km2",
    luas_ha:"f_luas_ha",
    jumlah_rt:"f_jumlah_rt",
    tempat_ibadah:"f_tempat_ibadah",
    operator_seluler:"f_operator_seluler",
    kekuatan_sinyal:"f_kekuatan_sinyal",
    jenis_sinyal_internet:"f_jenis_sinyal_internet",
    jenis_jalan:"f_jenis_jalan",
    angkutan_umum:"f_angkutan_umum",
    tahun_data:"f_tahun_data",
    sumber:"f_sumber",
    catatan_data:"f_catatan_data"

  };


  Object.keys(mapping).forEach(key => {

    const el =
      document.getElementById(mapping[key]);

    if(el){

      el.value =
        item[key] ?? "";

    }

  });


  modal.classList.remove("hidden");

};


/* ============================================
   SAVE
   ============================================ */

locationForm.addEventListener("submit", async e => {

  e.preventDefault();


  const value = id => {

    const el =
      document.getElementById(id);

    return el.value.trim();

  };


  const numeric = id => {

    const v = value(id);

    return v === ""
      ? null
      : Number(v);

  };


  const payload = {

    id:value("f_id"),

    nama:value("f_nama"),

    tipe:"desa",

    kode_kemendagri:
      value("f_kode_kemendagri"),

    kode_pos:
      value("f_kode_pos"),

    latitude:
      numeric("f_latitude"),

    longitude:
      numeric("f_longitude"),

    elevasi_m:
      numeric("f_elevasi_m"),

    jumlah_penduduk:
      numeric("f_jumlah_penduduk"),

    laki_laki:
      numeric("f_laki_laki"),

    perempuan:
      numeric("f_perempuan"),

    luas_km2:
      numeric("f_luas_km2"),

    luas_ha:
      numeric("f_luas_ha"),

    jumlah_rt:
      numeric("f_jumlah_rt"),

    tempat_ibadah:
      numeric("f_tempat_ibadah"),

    operator_seluler:
      numeric("f_operator_seluler"),

    kekuatan_sinyal:
      value("f_kekuatan_sinyal"),

    jenis_sinyal_internet:
      value("f_jenis_sinyal_internet"),

    jenis_jalan:
      value("f_jenis_jalan"),

    angkutan_umum:
      value("f_angkutan_umum"),

    tahun_data:
      numeric("f_tahun_data"),

    sumber:
      value("f_sumber"),

    catatan_data:
      value("f_catatan_data"),

    updated_at:
      new Date().toISOString()

  };


  let result;


  if(editMode){

    result =
      await supabaseClient
        .from("locations")
        .update(payload)
        .eq("id",originalId);

  }else{

    result =
      await supabaseClient
        .from("locations")
        .insert(payload);

  }


  if(result.error){

    alert(
      "Gagal menyimpan: " +
      result.error.message
    );

    return;
  }


  closeModal();

  await loadLocations();

  alert("Data berhasil disimpan.");

});


/* ============================================
   DELETE
   ============================================ */

window.deleteLocation =
async function(id){

  const item =
    locations.find(x => x.id === id);

  if(!item) return;


  const confirmDelete =
    confirm(
      `Hapus data ${item.nama}?`
    );


  if(!confirmDelete) return;


  const {
    error
  } =
    await supabaseClient
      .from("locations")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      "Gagal menghapus: " +
      error.message
    );

    return;
  }


  await loadLocations();

  alert("Data berhasil dihapus.");

};

/* ============================================
   ESCAPE HTML
   ============================================ */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
